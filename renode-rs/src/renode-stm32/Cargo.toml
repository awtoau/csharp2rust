[package]
name = "renode-stm32"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# Runtime support for translated C#: types C# has and Rust does not.
csharp-rt = { path = "../csharp-rt" }
# Renode's this.Log(LogLevel.X, ...) maps to the log crate's macros.
log = "0.4"
renode-regs = { path = "../renode-regs" }

[dev-dependencies]
renode-oracle = { path = "../renode-oracle" }
